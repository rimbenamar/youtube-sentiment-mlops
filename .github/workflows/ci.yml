name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  python-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      - name: Entraîner si le modèle n'est pas commité
        run: |
          if [ ! -f models/sentiment_model.joblib ]; then python run_pipeline.py --fast; fi
      - name: Tests Python
        run: pytest -v
      - name: Build de l'image Docker
        run: docker build -t youtube-sentiment-api .
      - name: Test du conteneur
        run: |
          docker run -d -p 7860:7860 --name api youtube-sentiment-api
          for i in $(seq 1 30); do curl -fs localhost:7860/health && break; sleep 1; done
          API_URL=http://localhost:7860 pytest tests/test_api.py -v
